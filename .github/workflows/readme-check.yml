name: 🔗 README Link Checker

on:
  push:
    branches: [main]
    paths:
      - "README.md"
  schedule:
    # Runs every Monday at 8:00 AM UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check README Links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links in README.md
        uses: lycheeverse/lychee-action@v2
        with:
          # Check only README.md
          # Exclude dynamic image services and workflow-generated assets
          # (these return images, not pages, so lychee cannot validate them)
          args: >-
            --verbose
            --no-progress
            --timeout 30
            --max-retries 3
            --exclude "https://img.shields.io/"
            --exclude "https://capsule-render.vercel.app/"
            --exclude "https://readme-typing-svg.demolab.com/"
            --exclude "https://komarev.com/"
            --exclude "https://github-readme-stats.vercel.app/"
            --exclude "https://streak-stats.demolab.com/"
            --exclude "https://leetcard.jacoblin.cool/"
            --exclude "https://github-readme-activity-graph.vercel.app/"
            --exclude "https://github-profile-trophy.vercel.app/"
            --exclude "https://github-profile-summary-cards.vercel.app/"
            --exclude "https://raw.githubusercontent.com/kartikshukla2301-eng/kartikshukla2301-eng/output/"
            --exclude "https://raw.githubusercontent.com/kartikshukla2301-eng/kartikshukla2301-eng/main/github-metrics.svg"
            README.md
          # Fail the workflow if any real link is broken
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
